<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: summary strip (indices) on top, then a responsive grid of stock cards with intraday sparklines. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #14202b; --ink2: #4b5a68; --muted: #7d8a96;
  --line: #e1e6eb; --accent: #1f6f78;
  --up: #1a7f4b; --down: #c23b3b; --up-bg: #e3f4ea; --down-bg: #fbe6e6;
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b; --surface: #16202a; --ink: #e8eef3; --ink2: #a9b8c4; --muted: #75848f;
    --line: #25323d; --accent: #5fb8c2;
    --up: #4cc38a; --down: #ef7676; --up-bg: #15332a; --down-bg: #3a1f22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b; --surface: #16202a; --ink: #e8eef3; --ink2: #a9b8c4; --muted: #75848f;
  --line: #25323d; --accent: #5fb8c2;
  --up: #4cc38a; --down: #ef7676; --up-bg: #15332a; --down-bg: #3a1f22; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { font: 600 30px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; }
.status { display: flex; align-items: center; gap: 10px; color: var(--ink2); font: 12px var(--f-mono); flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); }
.dot.stale { background: var(--down); }
button { font: 500 12px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 2px; background: var(--line); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
h2 { font: 600 11px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; position: relative; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.sym { font: 500 12px var(--f-mono); color: var(--muted); }
.name { font-weight: 600; font-size: 14px; }
.pill { font: 500 12px var(--f-mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.up { color: var(--up); background: var(--up-bg); }
.pill.down { color: var(--down); background: var(--down-bg); }
.price { font: 500 26px var(--f-mono); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.price small { font-size: 12px; color: var(--muted); margin-left: 4px; }
.chg { font: 12px var(--f-mono); color: var(--ink2); font-variant-numeric: tabular-nums; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
svg.spark { width: 100%; height: 64px; display: block; margin-top: 8px; }
.meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font: 11px var(--f-mono); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--up-bg); } to { background: var(--surface); } }
.flash.down { animation-name: flashd; }
@keyframes flashd { from { background: var(--down-bg); } to { background: var(--surface); } }
.err { color: var(--down); font-size: 12px; margin-top: 8px; }
.tablewrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Market Board</h1>
      <div class="status" style="margin-top:6px"><span class="dot" id="dot"></span><span id="updated">Loading…</span></div>
    </div>
    <div class="status">
      <span id="countdown"></span>
      <button id="refresh">Refresh now</button>
      <button id="toggleTable" aria-pressed="false">Table view</button>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <div id="content"></div>
  <div id="tableView" hidden></div>

  <footer>Quotes from Yahoo Finance, refreshed every 60 seconds. Prices can be delayed up to 15 minutes depending on the exchange. Not financial advice.</footer>
</div>

<script>
const REFRESH_SECONDS = 60;
let state = { quotes: [], fetchedAt: 0 };
let prevPrices = {};
let nextAt = Date.now() + REFRESH_SECONDS * 1000;
let tableMode = false;

const fmt = (n, d = 2) => n == null ? "–" : n.toLocaleString("en-AU", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "");
const cls = n => (n >= 0 ? "up" : "down");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function spark(series, prev, up) {
  if (!series || series.length < 2) return "";
  const w = 240, h = 64, pad = 4;
  const vals = series.map(s => s[1]);
  let lo = Math.min(...vals, prev ?? Infinity), hi = Math.max(...vals, prev ?? -Infinity);
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => pad + (i / (vals.length - 1)) * (w - pad * 2);
  const y = v => h - pad - ((v - lo) / (hi - lo)) * (h - pad * 2);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const color = up ? "var(--up)" : "var(--down)";
  const area = `M${x(0)},${h - pad} L${pts.join(" L")} L${x(vals.length - 1)},${h - pad} Z`;
  const last = vals.length - 1;
  const base = prev != null ? `<line x1="${pad}" x2="${w - pad}" y1="${y(prev)}" y2="${y(prev)}" stroke="var(--line)" stroke-dasharray="3 3"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Intraday price trend">
    ${base}<path d="${area}" fill="${color}" opacity="0.12"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function card(q) {
  if (q.error) return `<div class="card"><div class="name">${esc(q.label)}</div><div class="sym">${esc(q.symbol)}</div><div class="err">Couldn't load this quote.</div></div>`;
  const up = q.change >= 0;
  const p = prevPrices[q.symbol];
  const flash = p != null && p !== q.price ? ` flash ${q.price < p ? "down" : ""}` : "";
  return `<div class="card${flash}">
    <div class="top"><div><div class="name">${esc(q.label)}</div><div class="sym">${esc(q.symbol)}</div></div>
      <span class="pill ${cls(q.pct)}">${up ? "▲" : "▼"} ${sign(q.pct)}${fmt(Math.abs(q.pct))}%</span></div>
    <div class="price">${fmt(q.price)}<small>${esc(q.currency || "")}</small></div>
    <div class="chg ${cls(q.change)}">${sign(q.change)}${fmt(Math.abs(q.change))} today</div>
    ${spark(q.series, q.prevClose, up)}
    <div class="meta"><span>L ${fmt(q.dayLow)}</span><span>H ${fmt(q.dayHigh)}</span></div>
  </div>`;
}

function render() {
  const groups = {};
  state.quotes.forEach(q => (groups[q.group] = groups[q.group] || []).push(q));
  const titles = { Indices: "Indices", US: "US stocks", ASX: "ASX stocks" };
  document.getElementById("content").innerHTML = Object.keys(groups)
    .map(g => `<h2>${titles[g] || g}</h2><div class="grid">${groups[g].map(card).join("")}</div>`).join("");

  const rows = state.quotes.filter(q => !q.error).map(q =>
    `<tr><td>${esc(q.label)} (${esc(q.symbol)})</td><td>${fmt(q.price)}</td><td>${sign(q.change)}${fmt(Math.abs(q.change))}</td><td>${sign(q.pct)}${fmt(Math.abs(q.pct))}%</td><td>${fmt(q.dayLow)}</td><td>${fmt(q.dayHigh)}</td><td>${q.volume ? q.volume.toLocaleString("en-AU") : "–"}</td></tr>`).join("");
  document.getElementById("tableView").innerHTML =
    `<div class="tablewrap"><table><thead><tr><th>Stock</th><th>Price</th><th>Change</th><th>Change %</th><th>Low</th><th>High</th><th>Volume</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  prevPrices = Object.fromEntries(state.quotes.filter(q => !q.error).map(q => [q.symbol, q.price]));
}

async function load() {
  const dot = document.getElementById("dot");
  try {
    const res = await fetch("/api/quotes", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state = await res.json();
    render();
    dot.classList.remove("stale");
    document.getElementById("updated").textContent = "Updated " + new Date(state.fetchedAt).toLocaleTimeString("en-AU");
  } catch (e) {
    dot.classList.add("stale");
    document.getElementById("updated").textContent = "Update failed, retrying. Showing last data.";
  }
  nextAt = Date.now() + REFRESH_SECONDS * 1000;
}

setInterval(() => {
  const left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  document.getElementById("countdown").textContent = `Next update in ${left}s`;
  document.getElementById("bar").style.width = `${((REFRESH_SECONDS - left) / REFRESH_SECONDS) * 100}%`;
  if (left === 0) load();
}, 1000);

document.getElementById("refresh").onclick = load;
document.getElementById("toggleTable").onclick = e => {
  tableMode = !tableMode;
  document.getElementById("content").hidden = tableMode;
  document.getElementById("tableView").hidden = !tableMode;
  e.target.setAttribute("aria-pressed", tableMode);
  e.target.textContent = tableMode ? "Card view" : "Table view";
};
load();
</script>
</body>
</html>
